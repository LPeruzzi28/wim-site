<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIM!</title>
    <link rel="preload" href="fonts/Anton-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>

    <header class="site-header">
        <a class="brand" href="#home">WIM<span class="accent-rust">.</span></a>
        <div class="header-right">
            <nav class="site-nav">
                <a href="#home" data-view-link="home">Accueil</a>
                <a href="#projets" data-view-link="projets">Réalisations</a>
                <a href="#inspirations" data-view-link="inspirations">Inspirations</a>
            </nav>
            <div class="clock" id="clock" aria-hidden="true">--:--</div>
        </div>
    </header>

    <main>
        <section id="home" data-view="home">
            <section class="top">
                <svg class="hero-scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
                    <defs>
                        <filter id="roughEdge" x="-40%" y="-40%" width="180%" height="180%">
                            <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7" result="noise" />
                            <feDisplacementMap in="SourceGraphic" in2="noise" scale="46" xChannelSelector="R" yChannelSelector="G" />
                        </filter>
                        <filter id="roughEdgeSmall" x="-40%" y="-40%" width="180%" height="180%">
                            <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="3" result="noise" />
                            <feDisplacementMap in="SourceGraphic" in2="noise" scale="30" xChannelSelector="R" yChannelSelector="G" />
                        </filter>
                    </defs>

                    <path class="hero-blob hero-blob-rust" filter="url(#roughEdge)" d="M840,340 C840,160 990,20 1180,20 C1370,20 1520,150 1520,340 C1520,510 1400,640 1180,640 C980,640 840,500 840,340 Z" />
                    <path class="hero-blob hero-blob-blue" filter="url(#roughEdgeSmall)" d="M760,560 C760,460 840,380 950,380 C1060,380 1130,460 1130,560 C1130,650 1040,710 950,710 C850,710 760,650 760,560 Z" />
                    <path class="hero-blob hero-blob-mustard" filter="url(#roughEdgeSmall)" d="M1230,480 C1230,410 1290,360 1360,360 C1430,360 1480,410 1480,480 C1480,545 1420,590 1360,590 C1290,590 1230,545 1230,480 Z" />
                </svg>
                <span class="corner corner-tl">Scroll pour explorer</span>
                <section class="Intro">
                    <span class="kicker">Louis Peruzzi</span>
                    <h1 id="title">What <span class="accent-rust">Inspire</span> Me <span class="accent-blue-text">!</span></h1>
                    <p class="Intro-text">

                    </p>
                </section>
                <span class="corner corner-br" id="project-count"></span>
            </section>
        </section>

        <div class="marquee" aria-hidden="true">
            <div class="marquee-track" id="marquee-track"></div>
        </div>

        <section id="projets" data-view="projets">
            <section class="portfolio">
                <span class="ghost-number" aria-hidden="true">01</span>
                <h2 id="portfolio-title">Réalisations</h2>
                <div class="portfolio-grid" id="portfolio-grid"></div>
            </section>

            <div class="portfolio-modal" id="portfolio-modal">
                <div class="portfolio-modal-content">
                    <button class="portfolio-modal-close" id="portfolio-modal-close" aria-label="Fermer">&times;</button>
                    <div class="portfolio-modal-media" id="portfolio-modal-media"></div>
                    <span class="portfolio-modal-tag" id="portfolio-modal-tag"></span>
                    <h3 id="portfolio-modal-title"></h3>
                    <p id="portfolio-modal-desc"></p>
                    <div class="portfolio-modal-links" id="portfolio-modal-links"></div>
                </div>
            </div>
        </section>

        <section id="inspirations" data-view="inspirations">
            <section class="inspo">
                <span class="ghost-number" aria-hidden="true">02</span>
                <h2 id="inspo-title">Inspirations</h2>
                <p class="inspo-intro"></p>
                <div class="inspo-grid" id="inspo-grid"></div>
            </section>
        </section>
    </main>

    <div class="player" id="player">
        <audio id="player-audio"></audio>
        <button class="player-toggle" id="player-toggle" aria-label="Lecture">
            <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18"><path d="M6 4l15 8-15 8V4z" fill="currentColor"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" hidden><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" fill="currentColor"/></svg>
        </button>
        <div class="player-body">
            <p class="player-title" id="player-title">—</p>
            <div class="player-bar" id="player-bar">
                <div class="player-bar-fill" id="player-bar-fill"></div>
            </div>
        </div>
        <button class="player-next" id="player-next" aria-label="Titre suivant">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 4l12 8-12 8V4zm13 0h2v16h-2V4z" fill="currentColor"/></svg>
        </button>
    </div>

    <script src="js/portfolio.js"></script>
    <script src="js/inspirations.js"></script>
    <script src="js/player.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
